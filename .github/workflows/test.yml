name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 still does.
          - os: ubuntu-latest
            python-version: "3.9"
          # macos-latest is Apple silicon, and the newest 3.9 built for it is 3.9.13.
          - os: macos-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the tool's requirements
        run: python -m pip install -r skills/pixelperfect/scripts/requirements.txt
      - name: Install PyYAML, so the tests also parse SKILL.md's frontmatter as real YAML
        run: python -m pip install pyyaml
      - name: Run the tests
        run: python -m unittest discover -s tests -v
